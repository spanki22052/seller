services:
  postgres:
    image: postgres:16-alpine
    container_name: seller_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    networks:
      - seller_network_prod
    # Production security: no exposed ports unless needed
    # ports:
    #   - "${DB_PORT:-5432}:5432"

  minio:
    image: minio/minio:latest
    container_name: seller_minio_prod
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - seller_network_prod
    # Production security: no exposed ports unless needed
    # ports:
    #   - "${MINIO_PORT:-9000}:9000"
    #   - "${MINIO_CONSOLE_PORT:-9001}:9001"

  backend:
    build:
      context: .
      target: production
    container_name: seller_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3002}"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      PRISMA_CLIENT_ENGINE_TYPE: library
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-public}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-private}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-media}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3002}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: npm run start:prod
    networks:
      - seller_network_prod

volumes:
  postgres_data_prod:
    driver: local
  minio_data_prod:
    driver: local

networks:
  seller_network_prod:
    driver: bridge
