services:
  client_admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://62.181.53.211:3002
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - seller_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ../server
      target: development
    container_name: seller_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "${PORT:-3002}"
      DATABASE_URL: postgresql://${DB_USER:-seller_user}:${DB_PASSWORD:-seller_secure_password_2024}@postgres:5432/${DB_NAME:-seller_db}?schema=public
      PRISMA_CLIENT_ENGINE_TYPE: library
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secure_password_2024}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC:-public}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-private}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-media}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "3002:3002"
    volumes:
      - ../server:/app
      - /app/node_modules
    networks:
      - seller_network

networks:
  seller_network:
    driver: bridge

